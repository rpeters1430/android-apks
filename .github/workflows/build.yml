name: Build patched APK

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      app_id:
        description: App ID from apps/
        required: true
        type: string
      upstream_apk_url:
        description: Optional authorized HTTPS APK URL overriding the configured source
        required: false
        type: string
      upstream_version:
        description: Version label for a manually supplied APK
        required: false
        type: string
      upstream_sha256:
        description: Optional expected SHA-256 for a manually supplied APK
        required: false
        type: string
      allow_unsupported_version:
        description: Build even if the patches do not list this app version as supported
        required: true
        default: false
        type: boolean
      publish_release:
        description: Publish a GitHub Release
        required: true
        default: true
        type: boolean
      force_rebuild:
        description: Replace assets if this exact release already exists
        required: true
        default: false
        type: boolean

concurrency:
  group: patch-hub-${{ github.event_name }}-${{ inputs.app_id || 'scheduled' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        env:
          MANUAL_APP: ${{ inputs.app_id }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            matrix="$(python3 scripts/patch_hub.py matrix --app "$MANUAL_APP")"
          else
            matrix="$(python3 scripts/patch_hub.py matrix)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_REPO: ${{ matrix.release_repo || github.repository }}
      # Apps with publish.repo release to that repo, which needs a PAT with contents:write.
      GH_TOKEN: ${{ matrix.release_repo && secrets.PUBLISH_TOKEN || github.token }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - id: build
        env:
          UPSTREAM_APK_URL: ${{ inputs.upstream_apk_url }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          UPSTREAM_SHA256: ${{ inputs.upstream_sha256 }}
        run: |
          args=(build --app "${{ matrix.app }}" --work-dir "$RUNNER_TEMP/patch-hub")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then args+=(--allow-disabled); fi
          [[ "${{ inputs.allow_unsupported_version }}" != "true" ]] || args+=(--allow-unsupported-version)
          [[ -z "$UPSTREAM_APK_URL" ]] || args+=(--upstream-apk-url "$UPSTREAM_APK_URL")
          [[ -z "$UPSTREAM_VERSION" ]] || args+=(--upstream-version "$UPSTREAM_VERSION")
          [[ -z "$UPSTREAM_SHA256" ]] || args+=(--upstream-sha256 "$UPSTREAM_SHA256")
          python3 scripts/patch_hub.py "${args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.app }}-${{ steps.build.outputs.tag }}
          path: |
            ${{ steps.build.outputs.apk }}
            ${{ steps.build.outputs.build_info }}
            ${{ steps.build.outputs.checksums }}
            ${{ steps.build.outputs.morphe_result }}
          retention-days: 3
          if-no-files-found: error
      - id: existing
        if: ${{ github.event_name == 'schedule' || inputs.publish_release }}
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$RELEASE_REPO" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish new release
        if: ${{ (github.event_name == 'schedule' || inputs.publish_release) && steps.existing.outputs.exists == 'false' }}
        env:
          TAG: ${{ steps.build.outputs.tag }}
          APP_NAME: ${{ steps.build.outputs.app_name }}
          VERSION: ${{ steps.build.outputs.version }}
          APK: ${{ steps.build.outputs.apk }}
          BUILD_INFO: ${{ steps.build.outputs.build_info }}
          CHECKSUMS: ${{ steps.build.outputs.checksums }}
          MORPHE_RESULT: ${{ steps.build.outputs.morphe_result }}
        run: |
          gh release create -R "$RELEASE_REPO" "$TAG" "$APK" "$BUILD_INFO" "$CHECKSUMS" "$MORPHE_RESULT" --title "$APP_NAME $VERSION" --notes "Automated patched build. Verify checksums and review build-info.json before installation."
      - name: Replace existing release assets
        if: ${{ inputs.publish_release && inputs.force_rebuild && steps.existing.outputs.exists == 'true' }}
        env:
          TAG: ${{ steps.build.outputs.tag }}
          APK: ${{ steps.build.outputs.apk }}
          BUILD_INFO: ${{ steps.build.outputs.build_info }}
          CHECKSUMS: ${{ steps.build.outputs.checksums }}
          MORPHE_RESULT: ${{ steps.build.outputs.morphe_result }}
        run: gh release upload -R "$RELEASE_REPO" "$TAG" "$APK" "$BUILD_INFO" "$CHECKSUMS" "$MORPHE_RESULT" --clobber
      - name: Report unchanged release
        if: ${{ steps.existing.outputs.exists == 'true' && !(inputs.publish_release && inputs.force_rebuild) }}
        run: echo "Release ${{ steps.build.outputs.tag }} already exists; nothing changed."
